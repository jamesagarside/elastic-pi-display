[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elastic-pi-display"
version = "0.4.0"
description = "Raspberry Pi desk display for Elastic Security: alert severities and AI findings at a glance"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "James Garside" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
elastic-display = "esd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
