# Touch calibration for SPI TFT resistive panels (ADS7846/XPT2046).
# The panel overlay's rotate= parameter rotates the framebuffer but not the
# touch controller's axes, so the touch coordinates have to be transformed to
# match. This matrix is for the documented dtoverlay rotate=270 orientation,
# where the touch Y axis ends up vertically mirrored against the display.
#
# If taps land in the wrong place with a different rotate= value, swap the
# matrix for the one that matches (libinput applies row-major [x' y' 1]):
#   no transform      1  0 0   0  1 0   0 0 1
#   invert Y          1  0 0   0 -1 1   0 0 1
#   invert X         -1  0 1   0  1 0   0 0 1
#   invert both      -1  0 1   0 -1 1   0 0 1
#   swap X/Y          0  1 0   1  0 0   0 0 1
#   swap + invert Y   0 -1 1   1  0 0   0 0 1
#   swap + invert X   0  1 0  -1  0 1   0 0 1
# Verify with: DISPLAY=:0 xinput test-xi2 --root (tap the corners).
Section "InputClass"
  Identifier "ADS7846 touchscreen calibration"
  MatchProduct "ADS7846"
  MatchIsTouchscreen "on"
  MatchDevicePath "/dev/input/event*"
  Option "CalibrationMatrix" "1 0 0 0 -1 1 0 0 1"
EndSection
