name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend tests
        run: |
          pip install -e "backend[dev]"
          cd backend && python -m pytest -q

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build backend wheel
        run: |
          pip install build
          python -m build --wheel backend --outdir backend/dist

      - name: Assemble release tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="elastic-security-display-${VERSION}"
          mkdir -p "${PKG}/wheel"
          cp backend/dist/*.whl "${PKG}/wheel/"
          cp -r frontend/dist "${PKG}/static"
          cp -r deploy "${PKG}/deploy"
          tar -czf "${PKG}.tar.gz" "${PKG}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: elastic-security-display-*.tar.gz
          generate_release_notes: true
